# Dependabot version updates (security updates are a separate switch in the repository settings).
# test_apps/ holds package-manager fixtures that are meant to pull old versions; it is not listed here.
version: 2
updates:
  # Root lockfile covers both workspaces (packages/backend, packages/ui).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Documentation site (VitePress) has its own lockfile.
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
