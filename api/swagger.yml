            schema:
              type: object
              required:
                - policyId
                - items
                - expiresAt
                - reason
              properties:
                policyId:
                  type: string
                  pattern: ^[0-9a-fA-F-]{36}$
                items:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required:
                      - ecosystem
                      - packageName
                      - versions
                    properties:
                      ecosystem:
                        type: string
                        enum:
                          - npm
                          - pypi
                          - go
                          - maven
                          - nuget
                          - cargo
                          - composer
                          - rubygems
                      packageName:
                        type: string
                        minLength: 1
                        maxLength: 512
                      versions:
                        type: array
                        minItems: 1
                        items:
                          type: string
                          maxLength: 256
                expiresAt:
                  type: string
                  format: date-time
                reason:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
