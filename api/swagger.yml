  /api/admin/users:
    get:
      tags:
        - Users
      description: "People, by email. Paged: limit (1–200, default 50) and offset;
        search matches part of the email. Filters: source (local | sso), role
        (User | Security), status (active | invited | disabled)."
      parameters:
        - schema:
            type: string
          in: query
          name: limit
          required: false
        - schema:
            type: string
          in: query
          name: offset
          required: false
        - schema:
            type: string
          in: query
          name: search
          required: false
        - schema:
            type: string
            enum:
              - local
              - sso
          in: query
          name: source
          required: false
        - schema:
            type: string
            enum:
              - User
              - Security
          in: query
          name: role
          required: false
        - schema:
            type: string
            enum:
              - active
              - invited
              - disabled
          in: query
          name: status
          required: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        email:
                          type: string
                        status:
                          type: string
                          enum:
                            - invited
                            - active
                            - disabled
                        role:
                          type: string
                          enum:
                            - User
                            - Security
                        source:
                          type: string
                          enum:
                            - local
                            - sso
                        invitePending:
                          type: boolean
                        hasPassword:
                          type: boolean
                        signInMethods:
                          type: array
                          items:
                            type: string
                        lastLoginAt:
                          type: string
                          nullable: true
                        lastLoginMethod:
                          type: string
                          nullable: true
                        lastLoginProvider:
                          type: string
                          nullable: true
                        createdAt:
                          type: string
                  total:
                    type: number
    post:
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - role
              properties:
                email:
                  type: string
                role:
                  type: string
                  enum:
                    - User
                    - Security
                sendInvite:
                  type: boolean
                  description: Default true. False adds the person without a password invitation,
                    for single sign-on.
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  email:
                    type: string
                  status:
                    type: string
                  role:
                    type: string
                  createdAt:
                    type: string
                  emailSent:
                    type: boolean
                  invited:
                    type: boolean
                  inviteUrl:
                    type: string
