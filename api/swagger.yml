      tags:
        - Config
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  baseUrl:
                    type: string
                    description: Gateway base URL for client configuration
                  sessionTokenDays:
                    type: integer
                    description: Registry token lifetime in days for User and Security. Default 30.
                      The browser session is 1 hour.
                  namespaceCollisionCheck:
                    type: boolean
                    description: Daily check whether reserved internal names exist on public
                      registries. Sends those names to the public registries.
                required:
                  - baseUrl
                  - sessionTokenDays
    patch:
      tags:
        - Config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionTokenDays:
                  type: integer
                  minimum: 1
                  maximum: 365
                  description: Registry token lifetime in days for User and Security
                namespaceCollisionCheck:
                  type: boolean
                  description: Turn the namespace collision check on or off
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  baseUrl:
                    type: string
                  sessionTokenDays:
                    type: integer
                  namespaceCollisionCheck:
                    type: boolean
                required:
                  - baseUrl
                  - sessionTokenDays
  /api/artifact-cache/status:
    get:
      tags:
        - Artifact cache
      description: The switch, the limits in force (Settings over environment), and
        the status each live pod reported in the last minute.
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                    description: "Switched on, on the pod that answered: the saved setting, or else
                      ARTIFACT_CACHE_ENABLED"
                  available:
                    type: boolean
                    description: A size per pod is set, so the cache can be switched on
                  environmentEnabled:
                    type: boolean
                    description: ARTIFACT_CACHE_ENABLED on the pod that answered
                  setting:
                    type: boolean
                    nullable: true
                    description: Saved in Settings; null follows ARTIFACT_CACHE_ENABLED
                  dir:
                    type: string
                    description: ARTIFACT_CACHE_DIR; not changeable in Settings
                  limits:
                    type: object
                    properties:
                      maxSizeGb:
                        type: number
                        nullable: true
                      maxFiles:
                        type: integer
                      maxAgeDays:
                        type: number
                      maxIdleDays:
                        type: number
                      maxFileMb:
                        type: number
                    description: "In force: saved values over the environment"
                  environmentLimits:
                    type: object
                    properties:
                      maxSizeGb:
                        type: number
                        nullable: true
                      maxFiles:
                        type: integer
                      maxAgeDays:
                        type: number
                      maxIdleDays:
                        type: number
                      maxFileMb:
                        type: number
                    description: From the ARTIFACT_CACHE_* variables
                  savedLimits:
                    type: object
                    properties:
                      maxSizeGb:
                        type: number
                        nullable: true
                      maxFiles:
                        type: integer
                      maxAgeDays:
                        type: number
                      maxIdleDays:
                        type: number
                      maxFileMb:
                        type: number
                    description: Saved in Settings; a missing field follows the environment
                  pods:
                    type: array
                    items:
                      type: object
                      properties:
                        pod:
                          type: string
                        state:
                          type: string
                          enum:
                            - ok
                            - off
                            - error
                        enabled:
                          type: boolean
                        available:
                          type: boolean
                        lastError:
                          type: string
                          nullable: true
                        sizeBytes:
                          type: number
                        maxSizeBytes:
                          type: number
                        limitedByDisk:
                          type: boolean
                        files:
                          type: integer
                        maxFiles:
                          type: integer
                        hits24h:
                          type: integer
                        misses24h:
                          type: integer
                        updatedAt:
                          type: string
                  redisAvailable:
                    type: boolean
                    description: "False: only the pod that answered is listed"
  /api/artifact-cache/settings:
    put:
      tags:
        - Artifact cache
      description: "Changes the artifact cache on every pod within seconds: `enabled`
        switches it on or off, `limits` sets maxSizeGb, maxFiles, maxAgeDays,
        maxIdleDays and maxFileMb. null goes back to the ARTIFACT_CACHE_*
        variable. Each pod keeps the cache within the free space of its disk.
        The directory is set by ARTIFACT_CACHE_DIR only."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                enabled:
                  type: boolean
                  nullable: true
                limits:
                  type: object
                  additionalProperties: false
                  properties:
                    maxSizeGb:
                      type: number
                      exclusiveMinimum: 0
                      maximum: 1000000
                      nullable: true
                    maxFiles:
                      type: integer
                      minimum: 1
                      maximum: 1000000000
                      nullable: true
                    maxAgeDays:
                      type: integer
                      minimum: 0
                      maximum: 3650
                      nullable: true
                    maxIdleDays:
                      type: integer
                      minimum: 0
                      maximum: 3650
                      nullable: true
                    maxFileMb:
                      type: integer
                      minimum: 1
                      maximum: 1048576
                      nullable: true
      responses:
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /api/artifact-cache/purge:
    post:
      tags:
        - Artifact cache
      description: "Removes one package (every version, or one) or every file from the
        artifact cache of every running pod. Send `{ ecosystem, package,
        version? }` or `{ all: true }`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                all:
                  type: boolean
                ecosystem:
                  type: string
                  enum:
                    - npm
                    - pypi
                    - go
                    - maven
                    - nuget
                    - cargo
                    - composer
                    - rubygems
                package:
                  type: string
                  minLength: 1
                  maxLength: 512
                version:
                  type: string
                  maxLength: 256
      responses:
        "202":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: integer
                    description: Files removed on the pod that answered
                  bytes:
                    type: number
                  pods:
                    type: integer
                    description: Pods that received the purge, including this one
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
