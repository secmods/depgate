# Template for the depgate-secrets Secret. Not applied by kustomization.yaml: copy it, fill it in, apply it
# once, and keep the copy out of version control. Or create it on the command line:
#
#   kubectl -n depgate create secret generic depgate-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=ADMIN_PASSWORD="$(openssl rand -hex 12)" \
#     --from-literal=DB_PASSWORD='...' \
#     --from-literal=REDIS_URL='rediss://:password@redis.example.com:6380'
apiVersion: v1
kind: Secret
metadata:
  name: depgate-secrets
  namespace: depgate
type: Opaque
stringData:
  # openssl rand -hex 32. The same on every pod, never changed after installation: a new value signs
  # everyone out and breaks every registry token.
  JWT_SECRET: ""
  # Password of the first admin (ADMIN_EMAIL in the ConfigMap), used only on an empty database.
  ADMIN_PASSWORD: ""
  # Password of DB_USER.
  DB_PASSWORD: ""
  # Redis 7, one endpoint (a standalone server, or a primary behind one failover address). noeviction.
  # rediss:// for TLS; the password goes in the URL.
  REDIS_URL: redis://:password@redis.example.com:6379
  # Only when the job queues have their own Redis:
  # QUEUE_REDIS_URL: redis://:password@redis-queue.example.com:6379
  # SMTP_PASSWORD: ""
